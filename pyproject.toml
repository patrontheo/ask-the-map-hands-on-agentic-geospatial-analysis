[project]
name = "ask-the-map-workshop"
version = "0.1.0"
description = "Ask the Map: hands-on agentic geospatial analysis workshop (DSS 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.7",
    "pyogrio>=0.10",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
