<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="slash" aria-hidden="true"></span>
      <h1>Ask the Map</h1>
    </div>
  </header>

  <main class="layout">
    <section class="map-area" aria-label="Map">
      <div id="map"></div>
      <div class="map-key">
        <label class="basemap-label" for="basemap">Basemap</label>
        <select id="basemap" aria-describedby="shape-hint">
          <option value="street">Street</option>
          <option value="satellite">Satellite</option>
          <option value="data">Data only</option>
        </select>
        <details id="layer-key" open>
          <summary>Map layers</summary>
          <div id="legend" class="legend" aria-label="Map layers"></div>
          <p id="shape-hint">Zoom in for buildings and parcels.</p>
        </details>
      </div>
      <div id="map-notice" class="map-notice" role="status" hidden></div>
    </section>

    <section class="chat" aria-label="Chat">
      <div id="empty-state" class="empty-state">
        <h2>What would you like to know?</h2>
        <p>The map shows the portfolio, the Le Porge wildfire footprint and the communes. Ask the assistant about them. Try one of these:</p>
        <ul class="suggestions">
          <li><button type="button">Which sites lie inside the wildfire footprint, and how many distinct sites is that?</button></li>
          <li><button type="button">What TIV do the sites in the footprint represent, and which companies have the highest exposed TIV?</button></li>
          <li><button type="button">For each company, what share of its portfolio TIV is inside the footprint?</button></li>
        </ul>
      </div>

      <ol id="messages" class="messages" aria-live="polite"></ol>

      <div class="composer-area">
        <div id="prompt-library" class="prompt-library" hidden></div>

        <form id="chat-form" class="composer">
          <button type="button" id="library-toggle" class="library-toggle" aria-expanded="false" aria-controls="prompt-library"
            title="Example prompts" aria-label="Example prompts">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
          </button>
          <div class="input-wrap">
            <label for="chat-input" class="visually-hidden">Your question</label>
            <textarea id="chat-input" rows="2" placeholder="Ask a question about the portfolio" required></textarea>
            <button type="submit" id="send" class="send" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor"
                d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z"/></svg>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <dialog id="trace-dialog" class="trace-dialog" aria-labelledby="trace-title">
    <section class="trace-panel">
      <header class="trace-header">
        <div><p>Behind the answer</p><h2 id="trace-title">Execution trace</h2></div>
        <button type="button" id="trace-close" class="trace-close" aria-label="Close execution trace" autofocus>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M6 18 18 6"/></svg>
        </button>
      </header>
      <div id="trace-content" class="trace-content"></div>
    </section>
  </dialog>

  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
